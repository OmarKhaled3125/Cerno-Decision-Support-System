<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Account</title>
    <style type="text/css">
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
        }

        body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            background-color: #000000;
        }

        * {
            box-sizing: border-box;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000000 !important;
            }

            .content-cell {
                background-color: #0a0a0a !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #000000;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#000000" style="background-color: #000000;">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 600px; background-color: #0a0a0a; border: 1px solid #333333; border-radius: 16px; overflow: hidden;">
                    <tr>
                        <td align="center" style="padding: 40px 0 20px 0;">
                            <h1
                                style="color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 300; letter-spacing: 4px; margin: 0;">
                                CERNO</h1>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 0 40px;">
                            <h2
                                style="color: #94a3b8; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; margin: 0; margin-bottom: 24px;">
                                Verify Your Account</h2>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 0 40px 30px 40px;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" bgcolor="#1a1a1a"
                                        style="border-radius: 8px; border: 1px solid #333333; padding: 20px 40px;">
<span style="color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px; display: block;">{{ otp_code }}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center"
                            style="padding: 0 40px 40px 40px; color: #cbd5e1; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6;">
                            Use the code above to complete your registration.<br />
                            <span style="color: #64748b; font-size: 12px; margin-top: 10px; display: block;">This code
                                expires in 10 minutes.</span>
                        </td>
                    </tr>
                </table>
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td align="center"
                            style="padding: 20px 0; color: #475569; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px;">
                            &copy; 2025 Cerno. All rights reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
